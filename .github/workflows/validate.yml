name: Validate repository scaffold

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate starter project
        run: |
          python tools/validate_scaffold.py
          python tools/validate_art_manifest.py
